name: BorrowBox CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Backend Compilation & Run Unit/Integration Tests
        working-directory: ./backend
        run: mvn clean verify

      - name: Package Spring Boot Production Artifact
        working-directory: ./backend
        run: mvn clean package -DskipTests
