<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — BorrowBox</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem;">Your Saved Wishlist</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Keep track of equipment you want to rent for upcoming projects</p>
      </div>

      <div class="equipment-grid" id="wishlist-grid">
        <!-- Loaded via JS -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 BorrowBox Inc. All rights reserved.</span>
      <span>Rent Smart. Own Less.</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;
      loadWishlist();
    });

    async function loadWishlist() {
      const grid = document.getElementById('wishlist-grid');
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;"><div class="spinner"></div></div>';

      try {
        const items = await ApiClient.get('/wishlist');
        if (!items || items.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
              <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your wishlist is empty</h3>
              <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 1.5rem;">Explore our marketplace and click the heart icon on any gear to save it for later.</p>
              <a href="explore.html" class="btn btn-primary">Explore Equipment</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = items.map(eq => UI.renderEquipmentCard(eq, true)).join('');
      } catch (e) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 3rem;">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
