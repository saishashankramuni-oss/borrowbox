<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — BorrowBox</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card" style="max-width: 480px; width: 100%; padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Your Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Join BorrowBox to rent gear or list your own equipment</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Account Primary Role</label>
          <select id="role" class="form-control">
            <option value="ROLE_RENTER">Renter — I want to discover & rent equipment</option>
            <option value="ROLE_OWNER">Equipment Owner — I want to list equipment for rent</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Rahul Sharma" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8" oninput="checkPasswordStrength(this.value)">
          <div id="password-strength" style="font-size: 0.78rem; margin-top: 0.35rem; color: var(--text-secondary);"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="terms" required style="margin-top: 0.2rem;">
            <span>I agree to BorrowBox's <a href="about.html#terms">Terms of Service</a> and <a href="about.html#privacy">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary btn-lg" style="width: 100%;">Create Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="font-weight: 600;">Log in</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    function checkPasswordStrength(pass) {
      const el = document.getElementById('password-strength');
      if (pass.length === 0) { el.textContent = ''; return; }
      if (pass.length < 8) {
        el.textContent = 'Password must be at least 8 characters';
        el.style.color = 'var(--danger)';
      } else if (pass.length >= 8 && /[A-Z]/.test(pass) && /[0-9]/.test(pass)) {
        el.textContent = 'Strong password ✓';
        el.style.color = 'var(--success)';
      } else {
        el.textContent = 'Moderate password (add uppercase & numbers for better security)';
        el.style.color = 'var(--warning)';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('role').value;

      if (password !== confirmPassword) {
        UI.showToast('Passwords do not match!', 'error');
        return;
      }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const response = await ApiClient.post('/auth/register', {
          fullName, email, phone, password, role
        });

        Auth.saveSession(response.token, response.user);
        UI.showToast('Account created successfully!', 'success');

        setTimeout(() => {
          window.location.href = role === 'ROLE_OWNER' ? 'owner-dashboard.html' : 'renter-dashboard.html';
        }, 600);
      } catch (err) {
        UI.showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
