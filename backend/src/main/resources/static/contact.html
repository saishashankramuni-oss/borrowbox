<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support — BorrowBox</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 640px;">
      <div style="text-align: center; margin-bottom: 2.5rem;">
        <h1 style="font-size: 2.2rem;">Contact BorrowBox Support</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Have questions or need assistance with a rental booking?</p>
      </div>

      <form class="card" style="padding: 2.5rem;" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" placeholder="Full name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" placeholder="Booking query, equipment listing, or support" required>
        </div>

        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="How can our team help you?" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 BorrowBox Inc. All rights reserved.</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      UI.showToast('Thank you for contacting BorrowBox support! We will respond shortly.', 'success');
      e.target.reset();
    }
  </script>
</body>
</html>
