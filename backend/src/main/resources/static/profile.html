<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings — BorrowBox</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 600px;">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem;">Profile Settings</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Manage your personal account details</p>
      </div>

      <form id="profile-form" class="card" style="padding: 2.5rem;" onsubmit="handleUpdateProfile(event)">
        <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem;">
          <img id="profile-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;" alt="Avatar">
          <div>
            <h3 id="profile-name-title" style="font-size: 1.2rem; margin-bottom: 0.25rem;">User Name</h3>
            <span id="profile-role-badge" class="badge badge-approved">Role</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address (Read-only)</label>
          <input type="email" id="email" class="form-control" disabled style="background: var(--bg-subtle);">
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label">Avatar Image URL</label>
          <input type="url" id="avatarUrl" class="form-control" placeholder="https://..." oninput="document.getElementById('profile-avatar-preview').src = this.value">
        </div>

        <button type="submit" id="save-profile-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.5rem;">Save Profile Changes</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 BorrowBox Inc. All rights reserved.</span>
      <span>Rent Smart. Own Less.</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;
      const user = await Auth.fetchCurrentUser() || Auth.getUser();

      document.getElementById('fullName').value = user.fullName;
      document.getElementById('email').value = user.email;
      document.getElementById('phone').value = user.phone || '';
      document.getElementById('avatarUrl').value = user.avatarUrl || '';
      document.getElementById('profile-avatar-preview').src = user.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80';
      document.getElementById('profile-name-title').textContent = user.fullName;
      document.getElementById('profile-role-badge').textContent = user.role.replace('ROLE_', '');
    });

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const avatarUrl = document.getElementById('avatarUrl').value.trim();

      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;

      try {
        const updated = await ApiClient.patch('/users/me', { fullName, phone, avatarUrl });
        Auth.saveSession(Auth.getToken(), updated);
        UI.showToast('Profile updated successfully!', 'success');
        renderNavbar();
      } catch (err) {
        UI.showToast(err.message || 'Failed to update profile', 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
