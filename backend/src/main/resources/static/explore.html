<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Equipment — BorrowBox Marketplace</title>
  <meta name="description" content="Search and filter equipment for rent. Cameras, laptops, projectors, audio gear, tools, and gaming consoles near you.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.2rem;">Explore Gear Marketplace</h1>
        <p style="color: var(--text-secondary); margin-top: 0.25rem;">Browse verified equipment available for rent near you</p>
      </div>

      <div class="explore-layout">
        <!-- FILTER SIDEBAR -->
        <aside class="filter-sidebar">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
            <h3 style="font-size: 1.1rem;">Filters</h3>
            <button class="btn btn-sm btn-secondary" onclick="clearAllFilters()">Clear All</button>
          </div>

          <!-- Category Filter -->
          <div class="filter-section">
            <h4 class="filter-title">Category</h4>
            <select id="filter-category" class="form-control" onchange="applyFilters()">
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Availability Dates Filter -->
          <div class="filter-section">
            <h4 class="filter-title">Rental Dates Availability</h4>
            <div class="form-group" style="margin-bottom: 0.75rem;">
              <label class="form-label" style="font-size: 0.8rem;">Start Date</label>
              <input type="date" id="filter-start-date" class="form-control" onchange="applyFilters()">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" style="font-size: 0.8rem;">End Date</label>
              <input type="date" id="filter-end-date" class="form-control" onchange="applyFilters()">
            </div>
          </div>

          <!-- Location Filter -->
          <div class="filter-section">
            <h4 class="filter-title">Location</h4>
            <input type="text" id="filter-location" class="form-control" placeholder="City or locality" oninput="debounceApplyFilters()">
          </div>

          <!-- Price Range Filter -->
          <div class="filter-section">
            <h4 class="filter-title">Daily Price (₹)</h4>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <input type="number" id="filter-min-price" class="form-control" placeholder="Min ₹" min="0" oninput="debounceApplyFilters()">
              <span>-</span>
              <input type="number" id="filter-max-price" class="form-control" placeholder="Max ₹" min="0" oninput="debounceApplyFilters()">
            </div>
          </div>
        </aside>

        <!-- MAIN MARKETPLACE LISTINGS AREA -->
        <div>
          <!-- Search & Sort Controls Bar -->
          <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 260px; position: relative;">
              <input type="text" id="search-query" class="form-control" placeholder="Search by equipment name, brand, model..." oninput="debounceApplyFilters()" style="padding-left: 2.5rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>

            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <label class="form-label" style="margin: 0; white-space: nowrap; font-size: 0.85rem;">Sort by:</label>
              <select id="sort-by" class="form-control" style="width: auto; padding-top: 0.5rem; padding-bottom: 0.5rem;" onchange="applyFilters()">
                <option value="newest">Newest First</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>

          <!-- RESULTS COUNT & GRID -->
          <div id="results-count" style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem; font-weight: 500;">Loading equipment...</div>

          <div class="equipment-grid" id="explore-grid">
            <!-- Loaded via JS -->
          </div>

          <!-- PAGINATION CONTAINER -->
          <div id="pagination-wrap" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 3rem;">
            <!-- Loaded via JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <span>&copy; 2026 BorrowBox Inc. All rights reserved.</span>
      <span>Rent Smart. Own Less.</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let currentPage = 0;
    let debounceTimer;

    document.addEventListener('DOMContentLoaded', () => {
      // Parse URL Parameters
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('query')) document.getElementById('search-query').value = urlParams.get('query');
      if (urlParams.get('location')) document.getElementById('filter-location').value = urlParams.get('location');
      
      loadCategoriesDropdown().then(() => {
        if (urlParams.get('category')) {
          const catSelect = document.getElementById('filter-category');
          for (let opt of catSelect.options) {
            if (opt.dataset.slug === urlParams.get('category')) {
              opt.selected = true;
              break;
            }
          }
        }
        fetchListings();
      });
    });

    async function loadCategoriesDropdown() {
      try {
        const categories = await ApiClient.get('/categories');
        const select = document.getElementById('filter-category');
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.dataset.slug = cat.slug;
          opt.textContent = cat.name;
          select.appendChild(opt);
        });
      } catch (e) {}
    }

    async function fetchListings(page = 0) {
      currentPage = page;
      const grid = document.getElementById('explore-grid');
      const countEl = document.getElementById('results-count');
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;"><div class="spinner"></div><p style="color: var(--text-secondary); margin-top: 1rem;">Searching marketplace...</p></div>';

      const query = document.getElementById('search-query').value.trim();
      const categoryId = document.getElementById('filter-category').value;
      const location = document.getElementById('filter-location').value.trim();
      const minPrice = document.getElementById('filter-min-price').value;
      const maxPrice = document.getElementById('filter-max-price').value;
      const startDate = document.getElementById('filter-start-date').value;
      const endDate = document.getElementById('filter-end-date').value;
      const sortBy = document.getElementById('sort-by').value;

      let params = new URLSearchParams();
      params.append('page', page);
      params.append('size', 12);
      params.append('sortBy', sortBy);
      if (query) params.append('query', query);
      if (categoryId) params.append('categoryId', categoryId);
      if (location) params.append('location', location);
      if (minPrice) params.append('minPrice', minPrice);
      if (maxPrice) params.append('maxPrice', maxPrice);
      if (startDate) params.append('startDate', startDate);
      if (endDate) params.append('endDate', endDate);

      try {
        const data = await ApiClient.get(`/equipment?${params.toString()}`);
        const listings = data.content || [];
        countEl.textContent = `Showing ${listings.length} of ${data.totalElements || listings.length} equipment listings`;

        if (listings.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" style="margin-bottom: 1rem;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem;">No equipment matches your filters</h3>
              <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 1.5rem;">Try adjusting your keywords, price range, or clearing date filters to see more listings.</p>
              <button class="btn btn-secondary" onclick="clearAllFilters()">Clear All Filters</button>
            </div>
          `;
          document.getElementById('pagination-wrap').innerHTML = '';
          return;
        }

        grid.innerHTML = listings.map(eq => UI.renderEquipmentCard(eq)).join('');
        renderPagination(data.totalPages || 1, page);

      } catch (e) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 3rem;">Error loading listings: ${e.message}</div>`;
      }
    }

    function renderPagination(totalPages, page) {
      const wrap = document.getElementById('pagination-wrap');
      if (totalPages <= 1) {
        wrap.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 0; i < totalPages; i++) {
        html += `<button class="btn ${i === page ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="fetchListings(${i})">${i + 1}</button>`;
      }
      wrap.innerHTML = html;
    }

    function applyFilters() {
      fetchListings(0);
    }

    function debounceApplyFilters() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => applyFilters(), 400);
    }

    function clearAllFilters() {
      document.getElementById('search-query').value = '';
      document.getElementById('filter-category').value = '';
      document.getElementById('filter-location').value = '';
      document.getElementById('filter-min-price').value = '';
      document.getElementById('filter-max-price').value = '';
      document.getElementById('filter-start-date').value = '';
      document.getElementById('filter-end-date').value = '';
      document.getElementById('sort-by').value = 'newest';
      applyFilters();
    }
  </script>
</body>
</html>
