spring:
  application:
    name: borrowbox-backend

  datasource:
    url: ${DB_URL:${DATABASE_URL:${MYSQL_URL:jdbc:h2:mem:borrowbox_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}}
    username: ${DB_USERNAME:${MYSQLUSER:${DATABASE_USERNAME:sa}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${DATABASE_PASSWORD:}}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:3}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:${PORT:8080}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION:86400000}

borrowbox:
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.netlify.app,https://*.onrender.com,http://localhost:8080,http://localhost:5500,http://localhost:3000}
